name: C-MAPSS Predictive Maintenance CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    
    steps:
      - uses: actions/checkout@v3
    
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn lightgbm pyyaml matplotlib seaborn tqdm
    
      - name: Install project
        run: |
          cd predictive-maintenance-cmapss
          pip install -e .
    
      - name: Run tests
        run: |
          cd predictive-maintenance-cmapss
          python -m pytest tests/ -v
    
      - name: Lint
        run: |
          cd predictive-maintenance-cmapss
          python -m flake8 src/ --max-line-length=88
    
      - name: Check data files
        run: |
          cd predictive-maintenance-cmapss
          python scripts/check_data.py